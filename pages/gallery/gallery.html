<!--
 * 星云日志 - 图片展示页面
 * 依赖：shared.css（全局样式表）
 * 版本：v1.0.0
 * 功能：CSS Grid 灵活网格布局，长短图自动适配，控制面板动态调整显示高度
 * 技术：grid-auto-rows, grid-row: span 2, CSS变量 --short-height / --long-height
-->

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>图片展示 - 星云日志</title>
    <link rel="stylesheet" href="/shared.css">
    <style>
        /* ===== 图片网格专属样式 ===== */

        /* CSS变量：可由控制面板动态调整 */
        :root {
            --gallery-short-height: 200px;
            --gallery-long-height: 400px;
        }

        .gallery-section {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 40px;
        }

        /* 控制面板 */
        .gallery-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 32px;
            padding: 20px 28px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .control-value {
            font-size: 0.85rem;
            color: var(--accent-primary);
            min-width: 36px;
            text-align: right;
            font-weight: 500;
        }

        .control-slider {
            width: 140px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--glass-border);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-primary);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(182, 218, 62, 0.4);
            transition: box-shadow var(--trans-fast);
        }

        .control-slider::-webkit-slider-thumb:hover {
            box-shadow: 0 0 16px rgba(182, 218, 62, 0.6);
        }

        .control-reset {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--trans-fast);
        }

        .control-reset:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* 图片网格 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            grid-auto-rows: minmax(120px, auto);
            grid-auto-flow: dense;
            gap: 14px;
        }

        .photo-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: zoom-in;
            background: var(--glass-bg);
        }

        .photo-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 28px rgba(182, 218, 62, 0.2);
        }

        /* 预览加载状态下的旋转指示器位置适配 */
        .photo-item.preview-loading {
            opacity: 0.7;
            transition: opacity var(--trans-fast);
        }

        /* 短图：占1行 */
        .photo-item--short {
            max-height: var(--gallery-short-height);
        }

        /* 长图：占2行 */
        .photo-item--long {
            grid-row: span 2;
            max-height: var(--gallery-long-height);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .gallery-controls {
                gap: 16px;
                padding: 16px 20px;
            }

            .control-slider {
                width: 100px;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .gallery-controls {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }

            .control-group {
                justify-content: space-between;
            }

            .photo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="decor-lines">
        <div class="line-tl"></div>
        <div class="line-br"></div>
    </div>

    <div class="main-container">
        <a href="/index.html" class="back-link">← 返回首页</a>

        <header class="header">
            <h1 class="main-title">图片展示</h1>
            <p class="subtitle">灵活网格 · 错落有致 · 自适应布局</p>
        </header>

        <!-- ==================== 控制面板 ==================== -->
        <div class="gallery-controls">
            <div class="control-group">
                <span class="control-label">短图高度</span>
                <input type="range" class="control-slider" id="shortHeightSlider" min="120" max="360" value="200"
                    step="10">
                <span class="control-value" id="shortHeightValue">200px</span>
            </div>
            <div class="control-group">
                <span class="control-label">长图高度</span>
                <input type="range" class="control-slider" id="longHeightSlider" min="280" max="700" value="400"
                    step="10">
                <span class="control-value" id="longHeightValue">400px</span>
            </div>
            <button class="control-reset" id="resetBtn">重置默认</button>
        </div>

        <!-- ==================== 图片网格 ==================== -->
        <section class="gallery-section">
            <div class="photo-grid">
                <img src="/images/gallery/GalleryV1_20260509_110943_0001_long.png"
                    class="photo-item photo-item--long preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0001_long.png">
                <img src="/images/gallery/GalleryV1_20260509_110943_0001_short.png"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0001_short.png">
                <img src="/images/gallery/GalleryV1_20260509_110943_0002_long.jpeg"
                    class="photo-item photo-item--long preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0002_long.jpeg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0002_short.gif"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0002_short.gif">
                <img src="/images/gallery/GalleryV1_20260509_110943_0003_long.gif"
                    class="photo-item photo-item--long preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0003_long.gif">
                <img src="/images/gallery/GalleryV1_20260509_110943_0003_short.png"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0003_short.png">
                <img src="/images/gallery/GalleryV1_20260509_110943_0004_long.jpeg"
                    class="photo-item photo-item--long preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0004_long.jpeg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0004_short.jpeg"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0004_short.jpeg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0005_long.jpg"
                    class="photo-item photo-item--long preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0005_long.jpg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0005_short.jpeg"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0005_short.jpeg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0006_long.jpg"
                    class="photo-item photo-item--long preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0006_long.jpg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0006_short.png"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0006_short.png">
                <img src="/images/gallery/GalleryV1_20260509_110943_0007_long.gif"
                    class="photo-item photo-item--long preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0007_long.gif">
                <img src="/images/gallery/GalleryV1_20260509_110943_0007_short.png"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0007_short.png">
                <img src="/images/gallery/GalleryV1_20260509_110943_0008_long.png"
                    class="photo-item photo-item--long preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0008_long.png">
                <img src="/images/gallery/GalleryV1_20260509_110943_0008_short.png"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0008_short.png">
                <img src="/images/gallery/GalleryV1_20260509_110943_0009_short.jpg"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0009_short.jpg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0010_short.jpg"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0010_short.jpg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0011_short.jpg"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0011_short.jpg">
                <img src="/images/gallery/GalleryV1_20260509_110943_0012_short.png"
                    class="photo-item photo-item--short preview-trigger" loading="lazy"
                    data-preview-src="/images/gallery/GalleryV1_20260509_110943_0012_short.png">
            </div>

            <script>
                // ==================== 控制面板交互 ====================
                var root = document.documentElement;
                var shortSlider = document.getElementById('shortHeightSlider');
                var longSlider = document.getElementById('longHeightSlider');
                var shortValue = document.getElementById('shortHeightValue');
                var longValue = document.getElementById('longHeightValue');
                var resetBtn = document.getElementById('resetBtn');

                var defaults = {
                    short: 200,
                    long: 400
                };

                function updateShortHeight(value) {
                    root.style.setProperty('--gallery-short-height', value + 'px');
                    shortValue.textContent = value + 'px';
                }

                function updateLongHeight(value) {
                    root.style.setProperty('--gallery-long-height', value + 'px');
                    longValue.textContent = value + 'px';
                }

                shortSlider.addEventListener('input', function () {
                    updateShortHeight(this.value);
                });

                longSlider.addEventListener('input', function () {
                    updateLongHeight(this.value);
                });

                resetBtn.addEventListener('click', function () {
                    shortSlider.value = defaults.short;
                    longSlider.value = defaults.long;
                    updateShortHeight(defaults.short);
                    updateLongHeight(defaults.long);
                });
            </script>

            <script src="/preview-system.js"></script>
</body>

</html>
