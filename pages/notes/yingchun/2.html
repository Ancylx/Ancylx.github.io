<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵活网格图片展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fafafa;
            padding: 20px;
        }

        /* 主容器 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-auto-rows: minmax(150px, auto);
            grid-auto-flow: dense;
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 图片基础类 */
        .photo-item {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .photo-item:hover {
            transform: scale(1.02);
        }

        /* 比例类型 */
        .photo-item--square {
            max-height: 300px;
        }

        .photo-item--portrait {
            grid-row: span 2;
            max-height: 600px;
        }

        /* 自定义尺寸类 */
        .photo-item--h-200 { max-height: 200px; }
        .photo-item--h-250 { max-height: 250px; }
        .photo-item--h-400 { max-height: 400px; }
        .photo-item--h-450 { max-height: 450px; }
        .photo-item--h-500 { max-height: 500px; }
        .photo-item--h-550 { max-height: 550px; }
        .photo-item--h-650 { max-height: 650px; }

        /* 响应式布局 */
        @media (min-width: 1200px) {
            .photo-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 992px) {
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .photo-item--square { max-height: 200px; }
            .photo-item--portrait { max-height: 400px; }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="photo-grid">
        <!-- 短图（正方形/横图） -->
        <img src="https://picsum.photos/600/400" class="photo-item photo-item--square" alt="示例1">
        <img src="https://picsum.photos/500/400" class="photo-item photo-item--square photo-item--h-250" alt="示例2">
        
        <!-- 长图（竖图） -->
        <img src="https://picsum.photos/400/800" class="photo-item photo-item--portrait" alt="示例3">
        <img src="https://picsum.photos/300/700" class="photo-item photo-item--portrait photo-item--h-550" alt="示例4">
        
        <!-- 混合排列 -->
        <img src="https://picsum.photos/450/350" class="photo-item photo-item--square" alt="示例5">
        <img src="https://picsum.photos/400/900" class="photo-item photo-item--portrait photo-item--h-650" alt="示例6">
        <img src="https://picsum.photos/550/400" class="photo-item photo-item--square" alt="示例7">
    </div>
</body>
</html>
