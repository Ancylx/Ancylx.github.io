<!--
 * 星云日志 - 留言板页面
 * 依赖：shared.css（全局样式表）
 * 版本：v1.0.0
 * 功能：昵称/邮箱/留言表单，正则实时验证邮箱，非空校验，模拟提交
 * 说明：本模块使用内联JavaScript，不依赖外部库，满足表单及正则表达式作业要求
-->

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>留言板 - 星云日志</title>
    <link rel="stylesheet" href="/shared.css">
    <style>
        /* ===== 留言表单专属样式 ===== */

        .form-container {
            width: 100%;
            max-width: 640px;
            margin: 0 auto 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: var(--glass-shadow);
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .form-label .required {
            color: var(--accent-primary);
            margin-left: 4px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color var(--trans-fast), box-shadow var(--trans-fast);
            outline: none;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px rgba(182, 218, 62, 0.2);
        }

        .form-input.error,
        .form-textarea.error {
            border-color: #f87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.3);
        }

        .form-input.valid {
            border-color: var(--accent-primary);
        }

        .form-textarea {
            min-height: 140px;
            resize: vertical;
        }

        .error-message {
            font-size: 0.82rem;
            color: #f87171;
            margin-top: 6px;
            display: none;
            letter-spacing: 0.03em;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-primary);
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #0f172a;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: background var(--trans-fast), box-shadow var(--trans-fast), transform var(--trans-fast);
        }

        .submit-btn:hover {
            background: var(--accent-glow);
            box-shadow: 0 0 24px rgba(182, 218, 62, 0.4);
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 提交成功提示 */
        .success-toast {
            display: none;
            padding: 16px 24px;
            background: rgba(182, 218, 62, 0.15);
            border: 1px solid var(--accent-primary);
            border-radius: 12px;
            text-align: center;
            color: var(--accent-primary);
            font-size: 1rem;
            margin-top: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .success-toast.show {
            display: block;
        }

        /* 亮色模式适配 */
        @media (prefers-color-scheme: light) {
            .form-input,
            .form-textarea {
                background: rgba(255, 255, 255, 0.6);
            }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="decor-lines">
        <div class="line-tl"></div>
        <div class="line-br"></div>
    </div>

    <div class="main-container">
        <a href="/index.html" class="back-link">← 返回首页</a>

        <header class="header">
            <h1 class="main-title">留言板</h1>
            <p class="subtitle">有任何问题或建议？欢迎留言交流</p>
        </header>

        <!-- ==================== 留言表单 ==================== -->
        <div class="form-container">
            <form id="contactForm" novalidate>

                <!-- 昵称 -->
                <div class="form-group">
                    <label class="form-label" for="nickname">昵称<span class="required">*</span></label>
                    <input type="text" id="nickname" class="form-input" placeholder="请输入你的昵称"
                        autocomplete="off" maxlength="30">
                    <span class="error-message" id="nicknameError">请输入昵称</span>
                </div>

                <!-- 邮箱 -->
                <div class="form-group">
                    <label class="form-label" for="email">邮箱<span class="required">*</span></label>
                    <input type="email" id="email" class="form-input" placeholder="example@mail.com"
                        autocomplete="off">
                    <span class="error-message" id="emailError">请输入有效的邮箱地址</span>
                </div>

                <!-- 留言内容 -->
                <div class="form-group">
                    <label class="form-label" for="message">留言内容<span class="required">*</span></label>
                    <textarea id="message" class="form-textarea" placeholder="写下你想说的话..."
                        maxlength="500"></textarea>
                    <span class="error-message" id="messageError">请输入留言内容</span>
                </div>

                <!-- 提交按钮 -->
                <button type="submit" class="submit-btn" id="submitBtn">提交留言</button>

                <!-- 成功提示 -->
                <div class="success-toast" id="successToast">
                    留言提交成功！感谢你的反馈。
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==================== 表单元素引用 ====================
        var form = document.getElementById('contactForm');
        var nicknameInput = document.getElementById('nickname');
        var emailInput = document.getElementById('email');
        var messageInput = document.getElementById('message');
        var nicknameError = document.getElementById('nicknameError');
        var emailError = document.getElementById('emailError');
        var messageError = document.getElementById('messageError');
        var successToast = document.getElementById('successToast');
        var submitBtn = document.getElementById('submitBtn');

        // ==================== 邮箱正则验证 ====================
        // 模式: 非空字符 + @ + 非空字符 + . + 非空字符
        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        /**
         * 实时邮箱格式校验（input事件）
         * 说明: 每次输入时检查格式，动态显示/隐藏错误提示与视觉反馈
         */
        emailInput.addEventListener('input', function () {
            var value = emailInput.value.trim();
            if (value.length === 0) {
                // 空值不提示，提交时统一校验
                emailInput.classList.remove('error', 'valid');
                emailError.classList.remove('show');
            } else if (emailRegex.test(value)) {
                emailInput.classList.add('valid');
                emailInput.classList.remove('error');
                emailError.classList.remove('show');
            } else {
                emailInput.classList.add('error');
                emailInput.classList.remove('valid');
                emailError.classList.add('show');
            }
        });

        /**
         * 隐藏成功提示（用户开始修改时自动消失）
         */
        function hideSuccess() {
            successToast.classList.remove('show');
        }
        nicknameInput.addEventListener('input', hideSuccess);
        emailInput.addEventListener('input', hideSuccess);
        messageInput.addEventListener('input', hideSuccess);

        /**
         * 清除所有错误状态
         */
        function clearErrors() {
            [nicknameInput, emailInput, messageInput].forEach(function (el) {
                el.classList.remove('error');
            });
            [nicknameError, emailError, messageError].forEach(function (el) {
                el.classList.remove('show');
            });
        }

        /**
         * 表单提交校验
         * 说明: 阻止默认行为，对所有字段进行非空和格式验证
         */
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            clearErrors();
            hideSuccess();

            var isValid = true;
            var nickname = nicknameInput.value.trim();
            var email = emailInput.value.trim();
            var message = messageInput.value.trim();

            // 昵称非空校验
            if (!nickname) {
                nicknameInput.classList.add('error');
                nicknameError.classList.add('show');
                isValid = false;
            }

            // 邮箱非空 + 格式校验
            if (!email) {
                emailInput.classList.add('error');
                emailError.textContent = '请输入邮箱地址';
                emailError.classList.add('show');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                emailInput.classList.add('error');
                emailError.textContent = '请输入有效的邮箱地址';
                emailError.classList.add('show');
                isValid = false;
            }

            // 留言内容非空校验
            if (!message) {
                messageInput.classList.add('error');
                messageError.classList.add('show');
                isValid = false;
            }

            // 全部通过：模拟提交
            if (isValid) {
                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';

                // 模拟异步提交（实际部署可替换为 fetch / Formspree 等）
                setTimeout(function () {
                    successToast.classList.add('show');
                    form.reset();
                    emailInput.classList.remove('valid');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交留言';
                }, 800);
            }
        });
    </script>

</body>

</html>
