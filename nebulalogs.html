<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta name="description" content="星云日志-一站式解决所有常见问题的个人主页">
    <title>星云日志-2.0</title>
</head>

<body>
    <!-- 主标题区 -->
    <section class="main-title-area">
        <header class="header">
            <h1 class="main-title" alt="主标题">Nebula Logs</h1>
            <p class="sub-title" alt="子标题">AnsWeb</p>
        </header>
    </section>
    <!-- 搜索区域 -->
    <section class="search-section">
        <div class="search-wrapper">
            <div class="search-box">
                <!-- 搜索引擎切换按钮 -->
                <button class="engine-switch" id="engineSwitch" title="切换搜索引擎" onclick="switchEngine()">
                    <img class="engine-icon" id="engineIcon"
                        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b6da3e' d='M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/svg%3E"
                        alt="搜索引擎图标">
                </button>
                <!-- 搜索输入框 -->
                <input id="search_input" class="search-input" type="text" placeholder="搜索技术内容..." autocomplete="off">
                <!-- 搜索执行按钮 -->
                <button class="search-btn" onclick="performSearch()" title="搜索">
                    <div class="search-icon"></div>
                </button>
            </div>
        </div>
    </section>
</body>

</html>
