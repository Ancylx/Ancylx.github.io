    <!-- =================================================================== -->
    <!-- 功能脚本区域（交互逻辑） -->
    <!-- 描述: 包含搜索引擎切换、搜索执行、分类折叠、头像预览等核心功能 -->
    <!-- =================================================================== -->
    <script>
        // ==================== 搜索引擎配置模块 ====================
        // 支持的搜索引擎配置（图标使用内联SVG，避免额外请求）
        const engines = [
            { name: 'Bing', url: 'https://www.bing.com/search?q=', icon: 'data:image/svg+xml,...' },
            { name: 'Google', url: 'https://www.google.com/search?q=', icon: 'data:image/svg+xml,...' },
            { name: 'YouTube', url: 'https://www.youtube.com/results?search_query=', icon: '...' },
            { name: 'BiliBili', url: 'https://search.bilibili.com/all?keyword=', icon: '...' },
            { name: '知乎', url: 'https://www.zhihu.com/search?type=content&q=', icon: '...' },
            { name: 'GitHub', url: 'https://github.com/search?q=', icon: '...' }
        ];

        let currentEngineIndex = 0;
        const engineIcon = document.getElementById('engineIcon');
        const engineSwitch = document.getElementById('engineSwitch');

        // 切换搜索引擎: 循环更新图标与提示文本
        function switchEngine() {
            currentEngineIndex = (currentEngineIndex + 1) % engines.length;
            const engine = engines[currentEngineIndex];
            engineIcon.src = engine.icon;
            engineIcon.alt = engine.name;
            engineSwitch.title = `当前: ${engine.name} (点击切换)`;
        }

        // 执行搜索: 获取输入内容并使用当前引擎打开新标签页
        function performSearch() {
            const input = document.getElementById('search_input');
            const query = input.value.trim();
            if (query) {
                const engine = engines[currentEngineIndex];
                window.open(`${engine.url}${encodeURIComponent(query)}`, '_blank');
                input.value = '';
            }
        }

        // ==================== 分类折叠模块 ====================
        // 切换分类卡片的展开/收起状态
        function toggleCategory(btn) {
            const content = btn.closest('.category-card').querySelector('.content-wrapper');
            const isCollapsed = content.classList.contains('collapsed');
            
            if (isCollapsed) {
                content.classList.remove('collapsed');
                btn.classList.remove('collapsed');
            } else {
                content.classList.add('collapsed');
                btn.classList.add('collapsed');
            }
        }

        // ==================== 搜索框交互模块 ====================
        // 监听回车键触发搜索
        document.getElementById('search_input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        // ==================== 滚动动画模块 ====================
        // 配置：当元素10%进入视口时触发，底部预留50px
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // 为所有分类卡片添加滚动淡入动画
        document.querySelectorAll('.category-card').forEach(card => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(40px)';
            card.style.transition = 'opacity 0.6s var(--trans-smooth), transform 0.6s var(--trans-smooth)';
            observer.observe(card);
        });

        // 初始化搜索引擎提示文本
        engineSwitch.title = `当前: ${engines[0].name} (点击切换)`;

        // ==================== 头像预览模块（双图源分离） ====================
        // 架构说明: 参考PhotoShow插件设计，采用单例模式+延迟预加载策略
        (function() {
            'use strict';

            // 全局配置常量
            const PREVIEW_CONFIG = {
                previewWidth: 400,      // 预览容器宽度
                previewHeight: 400,     // 预览容器高度
                preloadDelay: 150       // 预加载延迟（避免快速滑过时的无效请求）
            };

            // 状态管理（类似PhotoShow的viewer状态机）
            const previewState = {
                isShown: false,         // 预览显示状态
                isLoading: false,       // 加载锁定（防止重复触发）
                currentThumb: null,     // 当前缩略图元素
                previewContainer: null, // 预览容器单例
                preloadTimer: null      // 延迟加载定时器
            };

            // 创建全局预览容器（单例模式）
            // 挂载到根层级避免z-index层叠问题
            function createGlobalPreviewContainer() {
                if (previewState.previewContainer) return previewState.previewContainer;

                const container = document.createElement('div');
                container.className = 'avatar-preview-global';
                container.innerHTML = `
                    <img class="preview-image-global" 
                         src="" 
                         alt="头像预览"
                         loading="lazy">
                `;
                document.documentElement.appendChild(container);
                previewState.previewContainer = container;
                return container;
            }

            // 预加载高清图片（Promise封装）
            function preloadHDSrc(hdSrc) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const timeout = setTimeout(() => reject(new Error('加载超时')), 10000);
                    
                    img.onload = () => {
                        clearTimeout(timeout);
                        resolve(hdSrc);
                    };
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = hdSrc;
                });
            }

            // 显示预览（带加载状态）
            function showPreview(thumbElement, hdSrc) {
                if (previewState.isLoading) return;
                
                previewState.isLoading = true;
                previewState.currentThumb = thumbElement;
                thumbElement.classList.add('avatar-loading');

                const previewContainer = createGlobalPreviewContainer();
                const previewImage = previewContainer.querySelector('.preview-image-global');

                preloadHDSrc(hdSrc)
                    .then(() => {
                        previewImage.src = hdSrc;
                        requestAnimationFrame(() => {
                            previewContainer.classList.add('show');
                            previewState.isShown = true;
                        });
                    })
                    .catch(error => {
                        console.warn('头像预览加载失败:', error);
                    })
                    .finally(() => {
                        thumbElement.classList.remove('avatar-loading');
                        previewState.isLoading = false;
                    });
            }

            // 隐藏预览（带淡出动画）
            function hidePreview() {
                if (!previewState.previewContainer) return;
                const previewContainer = previewState.previewContainer;
                
                previewContainer.classList.remove('show');
                previewState.isShown = false;
                previewState.currentThumb = null;

                setTimeout(() => {
                    const previewImage = previewContainer.querySelector('.preview-image-global');
                    if (previewImage) previewImage.src = '';
                }, 300);
            }

            // 初始化头像包装器事件
            // 使用mouseenter/mouseleave避免子元素干扰
            function initializeAvatarPreview() {
                const avatarWrapper = document.querySelector('.avatar-wrapper');
                if (!avatarWrapper) return;

                const thumbSrc = avatarWrapper.dataset.avatarThumb;
                const hdSrc = avatarWrapper.dataset.avatarHd;

                if (!thumbSrc || !hdSrc) {
                    console.warn('头像包装器缺少data-avatar-thumb或data-avatar-hd属性');
                    return;
                }

                avatarWrapper.addEventListener('mouseenter', function() {
                    if (previewState.preloadTimer) clearTimeout(previewState.preloadTimer);
                    previewState.preloadTimer = setTimeout(() => showPreview(this, hdSrc), PREVIEW_CONFIG.preloadDelay);
                });

                avatarWrapper.addEventListener('mouseleave', function(e) {
                    if (previewState.preloadTimer) {
                        clearTimeout(previewState.preloadTimer);
                        previewState.preloadTimer = null;
                    }
                    if (!this.contains(e.relatedTarget)) hidePreview();
                });

                avatarWrapper.addEventListener('click', () => hidePreview());

                // ESC键全局隐藏预览
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && previewState.isShown) hidePreview();
                });
            }

            // DOM准备完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initializeAvatarPreview);
            } else {
                initializeAvatarPreview();
            }
        })();
    </script>

</body>
