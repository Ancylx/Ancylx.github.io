    <!-- 功能脚本区域（交互逻辑） -->
    <!-- 描述: 包含搜索引擎切换、搜索执行、分类折叠等核心功能 -->
    <!-- 说明: 通用预览系统已提取至preview-system.js -->
    <!-- =================================================================== -->
    <script>
        // ==================== 搜索引擎配置模块 ====================
        // 支持的搜索引擎配置（图标使用内联SVG，避免额外请求）
        const engines = [
            { name: 'Google', url: 'https://www.google.com/search?q=', icon: 'data:image/svg+xml,...' },
            { name: 'Bing', url: 'https://www.bing.com/search?q=', icon: 'data:image/svg+xml,...' },
            { name: 'YouTube', url: 'https://www.youtube.com/results?search_query=', icon: '...' },
            { name: 'BiliBili', url: 'https://search.bilibili.com/all?keyword=', icon: '...' },
            { name: '知乎', url: 'https://www.zhihu.com/search?type=content&q=', icon: '...' },
            { name: 'GitHub', url: 'https://github.com/search?q=', icon: '...' }
        ];

        let currentEngineIndex = 0;
        const engineIcon = document.getElementById('engineIcon');
        const engineSwitch = document.getElementById('engineSwitch');

        // 切换搜索引擎: 循环更新图标与提示文本
        function switchEngine() {
            currentEngineIndex = (currentEngineIndex + 1) % engines.length;
            const engine = engines[currentEngineIndex];
            engineIcon.src = engine.icon;
            engineIcon.alt = engine.name;
            engineSwitch.title = `当前: ${engine.name} (点击切换)`;
        }

        // 执行搜索: 获取输入内容并使用当前引擎打开新标签页
        function performSearch() {
            const input = document.getElementById('search_input');
            const query = input.value.trim();
            if (query) {
                const engine = engines[currentEngineIndex];
                window.open(`${engine.url}${encodeURIComponent(query)}`, '_blank');
                input.value = '';
            }
        }

        // ==================== 分类折叠模块 ====================
        // 切换分类卡片的展开/收起状态
        function toggleCategory(btn) {
            const content = btn.closest('.category-card').querySelector('.content-wrapper');
            const isCollapsed = content.classList.contains('collapsed');
            
            if (isCollapsed) {
                content.classList.remove('collapsed');
                btn.classList.remove('collapsed');
            } else {
                content.classList.add('collapsed');
                btn.classList.add('collapsed');
            }
        }

        // ==================== 搜索框交互模块 ====================
        // 监听回车键触发搜索
        document.getElementById('search_input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        // ==================== 滚动动画模块 ====================
        // 配置：当元素10%进入视口时触发，底部预留50px
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // 为所有分类卡片添加滚动淡入动画
        document.querySelectorAll('.category-card').forEach(card => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(40px)';
            card.style.transition = 'opacity 0.6s var(--trans-smooth), transform 0.6s var(--trans-smooth)';
            observer.observe(card);
        });

        // 初始化搜索引擎提示文本
        engineSwitch.title = `当前: ${engines[0].name} (点击切换)`;
    </script>
